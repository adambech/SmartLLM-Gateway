[project]
name = "smartllm-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "adambech", email = "tytwadm15@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.1",
    "fastembed>=0.9.1",
    "plotly>=7.1.0",
    "pydantic-settings>=2.16.2",
    "qdrant-client>=1.20.0",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
smartllm-gateway = "smartllm_gateway:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
